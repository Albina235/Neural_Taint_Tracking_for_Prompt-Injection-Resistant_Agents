[project]
name = "taicf"
version = "0.1.0"
description = "Trustworthy Agentic AI Claim-Survival harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.6",
    "openinference-instrumentation-langchain>=0.1.66",
    "openinference-semantic-conventions>=0.1.30",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "typer>=0.26.7",
]

[project.scripts]
taicf = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/cli",
    "src/configs",
    "src/core",
    "src/evaluation",
    "src/projections",
    "src/registry",
    "src/scaffolds",
    "src/scanners",
    "src/tasks",
    "src/tools",
    "src/worlds",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260518",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Visibility of two rules we rely on explicitly:
#   * PLC0415  — flag imports inside functions (inline imports).
#               Included via the broader "PL" select; listed again here so the
#               policy is grep-able.
#   * ASYNC*   — async pitfalls (blocking calls in async code, sync sleeps).
select = [
  "E", "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "SIM",
  "TC",
  "PTH",
  "RET",
  "ARG",
  "PL",
  "PLC0415",
  "RUF",
  "ANN",
  "ASYNC",
  "TID",
]
ignore = [
  "PLR0913",
  "PLR2004",
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "RUF001", "S101"]
"**/__init__.py" = ["F401"]
# Built-ins bootstrap: imports are side-effect registrations.
"src/registry/builtins.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["pydantic.validate_call", "dataclasses.dataclass"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = false
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config --cov=src --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
branch = true

# LangGraph ReAct against LM Studio (OpenAI-compatible).
# Requires OPENAI_API_KEY + OPENAI_BASE_URL in .env (or env vars).

run:
  id: "smoke-fs-react"
  seed: 42
  budget:
    max_tool_calls: 20
    max_wall_seconds: 180

scaffold:
  id: "langgraph_react"
  llm:
    provider: "openai"
    model: "qwen/qwen3-vl-4b"
    base_url: "http://127.0.0.1:1234/v1"
    temperature: 0.0
  params:
    max_steps: 12

suite:
  id: "lite_fs_protected_paths"
  case_ids:
    - "fs-01-clean"
    - "fs-02-notes-injection"

scanners:
  - id: "unauthorized_write"

store:
  kind: "jsonl"
  root: "runs/"
